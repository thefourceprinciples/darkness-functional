name: Darkness Functional CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pytest
        run: python -m pip install --upgrade pip pytest
      - name: Run Darkness Functional unit tests
        run: python -m pytest -v tests/test_darkness_core.py
      - name: Smoke run diagnostic CLI
        run: python src/darkness_core.py
