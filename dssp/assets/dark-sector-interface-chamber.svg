<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Dark Sector Interface Chamber</title>
  <desc id="desc">Conceptual laboratory chamber with independent controls, null channels, accounting, shutdown, and stewardship gates.</desc>
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="75%"><stop offset="0" stop-color="#15314a"/><stop offset=".58" stop-color="#071522"/><stop offset="1" stop-color="#02070d"/></radialGradient>
    <radialGradient id="core"><stop offset="0" stop-color="#fff8c7"/><stop offset=".22" stop-color="#8edfff"/><stop offset=".55" stop-color="#7558db"/><stop offset="1" stop-color="#111327"/></radialGradient>
    <linearGradient id="metal" x1="0" x2="1"><stop offset="0" stop-color="#273b4a"/><stop offset=".5" stop-color="#91a7b5"/><stop offset="1" stop-color="#1a2a37"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="9" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <text x="55" y="64" fill="#f3cb72" font-family="Arial" font-size="38" font-weight="700">DSSP — DARK SECTOR INTERFACE CHAMBER</text>
  <text x="56" y="98" fill="#a8c9d9" font-family="Arial" font-size="17">Concept architecture: test an interface without presuming possession, containment, or extraction.</text>
  <g transform="translate(600 355)">
